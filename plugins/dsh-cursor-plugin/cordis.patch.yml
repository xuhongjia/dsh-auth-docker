# Loopback Cursor SDK gateway. DSH llm-pi-ai calls this OpenAI-compatible
# route; the official webserver and auth plugin are unchanged.
# This row replaces composition config for id llm-pi-ai only. User
# $DSH_HOME/settings.yaml still merges per provider (e.g. opencode-go stays).
# models: one DSH picker row per Cursor model. Thinking uses reasoningEfforts
# (same control as official DeepSeek/OpenAI). Context defaults to the largest
# window; :fast/:slow stay SDK params (plugin default slow). Restore defaults
# if an older cursor.models overlay still has @1m/:fast rows or only auto.
- insert:
    - id: cursor-gateway
      name: dsh-cursor-plugin
      config:
        listenHost: '127.0.0.1'
        listenPort: 3090
        workspace: !!js dshHomePath('cursor-gateway')
        defaultFast: false

- id: llm-pi-ai
  config:
    providers:
      cursor:
        displayName: Cursor
        api: openai-completions
        baseURL: http://127.0.0.1:3090/v1
        apiKeyEnv: CURSOR_API_KEY
        defaultInput:
          - text
          - image
        defaultContextWindow: 200000
        defaultMaxTokens: 32768
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
        models:
          - id: "default"
            name: "Cursor Auto"
          - id: "composer-2.5"
            name: "Composer 2.5"
          - id: "composer-2"
            name: "Composer 2"
          - id: "auto-smart"
            name: "Auto"
          - id: "claude-fable-5"
            name: "Claude Fable 5"
            contextWindow: 1000000
            reasoningEfforts:
              off: off
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
