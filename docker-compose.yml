services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/xuhongjia/dsh-auth-docker:0.0.1}
    build: .
    ports:
      - "3080:3080"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD}
      DSH_AUTH_SECRET: ${DSH_AUTH_SECRET}
      DSH_AUTH_BASE_URL: ${DSH_AUTH_BASE_URL:-http://localhost:3080}
      PORT: "3080"
    volumes:
      - dsh-data:/data

volumes:
  dsh-data:
