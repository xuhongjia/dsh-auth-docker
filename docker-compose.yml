services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/xuhongjia/dsh-auth-docker:0.0.3}
    build: .
    ports:
      - "3080:3080"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD}
      DSH_AUTH_SECRET: ${DSH_AUTH_SECRET}
      DSH_AUTH_BASE_URL: ${DSH_AUTH_BASE_URL:-http://localhost:3080}
      DSH_AUTH_SECURE_COOKIES: ${DSH_AUTH_SECURE_COOKIES:-}
      DSH_AUTH_TRUSTED_ORIGINS: ${DSH_AUTH_TRUSTED_ORIGINS:-}
      PORT: "3080"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - dsh-data:/data

volumes:
  dsh-data:
